[project]
name = "legal-doc-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.139.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
]

[project.scripts]
legal-doc-tool = "legal_doc_tool:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
